# 构建、推送到 GHCR 并部署到服务器
name: Build, publish and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 阶段一：构建镜像并推送到 GitHub Container Registry
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 始终产出 latest 标签，方便部署阶段直接 pull :latest
          flavor: |
            latest=true

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # 阶段二：通过 SSH 登录服务器，拉取最新镜像并重启容器
  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
            CONTAINER="${{ github.event.repository.name }}"
            CONFIG_FILE="/opt/1panel/apps/openresty/openresty/www/sites/edge-balancer.shenzjd.com/index/config.yaml"

            # 配置文件由服务器本地维护（1Panel 文件管理或 SSH 提前放好）：
            # CI 只负责部署，配置不经过 GitHub Secrets、也不进镜像。
            if [ ! -f "$CONFIG_FILE" ]; then
              echo "ERROR: $CONFIG_FILE 不存在，请先在服务器上创建配置文件" >&2
              exit 1
            fi

            # 数据库连接（v3）：从服务器本地 .env 读取（EDGE_DB_URL/EDGE_DB_TOKEN/EDGE_LISTEN），
            # 敏感信息不进 GitHub；没有 .env 时回退文件配置模式
            ENV_FILE="/opt/edge-balancer/.env"
            ENV_ARGS=""
            if [ -f "$ENV_FILE" ]; then
              ENV_ARGS="--env-file $ENV_FILE"
              echo "检测到 .env，启用数据库配置模式"
            fi

            sudo docker pull "$IMAGE"
            sudo docker rm -f "$CONTAINER" || true

            # host 网络：直接监听宿主机 6705（nginx 已反代 127.0.0.1:6705），
            # 无需 -p 端口映射，外部无法直连，仅限本机反代访问
            sudo docker run -d \
              --name "$CONTAINER" \
              --network host \
              $ENV_ARGS \
              --restart unless-stopped \
              --memory=256m \
              --memory-swap=384m \
              --cpus=0.5 \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              -v "$CONFIG_FILE:/app/config.yaml:ro" \
              "$IMAGE"

            sudo docker image prune -f
