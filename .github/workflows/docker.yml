# 构建、推送到 GHCR 并部署到服务器
name: Build, publish and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 阶段一：构建镜像并推送到 GitHub Container Registry
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 始终产出 latest 标签，方便部署阶段直接 pull :latest
          flavor: |
            latest=true

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # 阶段二：通过 SSH 登录服务器，拉取最新镜像并重启容器
  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
            CONTAINER="${{ github.event.repository.name }}"
            BASE_DIR="/opt/1panel/apps/openresty/openresty/www/sites/edge-balancer.shenzjd.com/index"
            ENV_FILE="$BASE_DIR/.env"
            CONFIG_FILE="$BASE_DIR/config.yaml"

            # DB 模式必需 .env（EDGE_DB_URL/EDGE_DB_TOKEN/EDGE_LISTEN/CF_API_TOKEN）。
            # 配置（站点/上游/failover 站点/全局设置）存在 Turso 数据库，面板热加载，不需要 config.yaml。
            # config.yaml 仅本地文件模式调试用：存在则挂载，不存在则跳过。
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE 不存在，请先在服务器上传 .env（含 EDGE_DB_URL/EDGE_DB_TOKEN/EDGE_LISTEN/CF_API_TOKEN）" >&2
              exit 1
            fi
            ENV_ARGS="--env-file $ENV_FILE"
            echo "检测到 .env，启用数据库配置模式"

            sudo docker pull "$IMAGE"
            sudo docker rm -f "$CONTAINER" || true

            RUN_ARGS="--name $CONTAINER --network host $ENV_ARGS --restart unless-stopped --memory=256m --memory-swap=384m --cpus=0.5 --log-opt max-size=10m --log-opt max-file=3"
            if [ -f "$CONFIG_FILE" ]; then
              RUN_ARGS="$RUN_ARGS -v $CONFIG_FILE:/app/config.yaml:ro"
              echo "检测到 config.yaml，挂载（文件模式调试）"
            fi

            # host 网络：直接监听宿主机 6705（nginx 已反代 127.0.0.1:6705），
            # 无需 -p 端口映射，外部无法直连，仅限本机反代访问
            sudo docker run -d $RUN_ARGS "$IMAGE"

            # 启动后快速自检：容器应处于 running（DB 连接失败会 fatal 退出）
            sleep 4
            STATE=$(sudo docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo missing)
            if [ "$STATE" != "running" ]; then
              echo "ERROR: 容器启动失败（状态 $STATE），最近日志：" >&2
              sudo docker logs --tail 30 "$CONTAINER" 2>&1 >&2 || true
              exit 1
            fi
            echo "部署完成，容器 $CONTAINER 运行中"

            sudo docker image prune -f
