# edge-balancer 配置示例（多站点版）
# 复制本文件为 config.yaml（已 gitignore），填入你的真实上游地址
#
# 架构：edge-balancer 是中心网关，按 Host 头（域名）路由。
# - 未匹配到任何 site 的域名 → 直接显示管理面板（管理入口）
# - 匹配到 site 的域名 → 按该 site 的上游配置分流
# 各业务域名的 1Panel/nginx 反代目标需指向 edge-balancer 的监听端口。

listen: ":8080"               # 监听地址
health_interval: 10           # 健康检查间隔（秒）
health_timeout: 5             # 健康检查超时（秒）
health_path: "/api/health"    # 默认健康检查路径

# 状态面板（v2）
admin_path: "/admin"          # 面板路径，默认 /admin
admin_token: "your-token"     # 可选：访问面板需要的 token（留空则不鉴权，公网部署强烈建议配置）

# 默认负载均衡策略（site 未单独指定时生效）：
#   least-conn  最少连接（推荐：动态均衡，避免某台上游被压垮）
#   weighted    加权随机（默认）
strategy: "least-conn"

# 上游转发超时（秒）：单次转发超过该时长即返回 502，
# 并计入该上游的熔断失败计数（连续 3 次失败熔断 30 秒，期间自动切到其它上游）
upstream_timeout: 10

# 站点列表：每个域名一组上游配置
sites:
  - domain: "panhub.shenzjd.com"   # 业务域名（匹配 Host 头）
    strategy: "least-conn"          # 可选：覆盖全局 strategy
    health_path: "/api/health"      # 可选：覆盖全局 health_path
    upstreams:
      - name: "cf-worker"
        url: "https://xxx.workers.dev"
        priority: 1                 # 优先级：越小越优先，挂了才轮到下一级
      - name: "docker"
        url: "http://127.0.0.1:5253"
        priority: 2                 # 兜底：内网源站直连

  - domain: "api.shenzjd.com"      # 另一个域名，独立一组上游
    upstreams:
      - name: "main"
        url: "http://127.0.0.1:8081"
        priority: 1
