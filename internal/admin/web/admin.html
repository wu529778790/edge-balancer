<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge Balancer 管理面板</title>
<style>
:root{
  --bg:#F5F6FA; --card:#FFFFFF; --sidebar:#1B1E2A;
  --primary:#4F46E5; --primary-soft:#EEF0FF;
  --text:#1F2329; --text-2:#3F444D; --text-3:#8A9099; --text-4:#9CA3AF;
  --border:#EDEEF2; --border-2:#E5E7EB;
  --ok:#10B981; --ok-soft:#ECFDF5; --ok-text:#059669;
  --bad:#EF4444; --bad-soft:#FEF2F2; --bad-text:#DC2626;
  --warn:#F59E0B; --warn-soft:#FFFBEB;
  --off:#9CA3AF; --off-soft:#F3F4F6;
  --radius:14px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.layout{display:flex;min-height:100vh}
/* ---------- 侧边栏 ---------- */
.sidebar{width:232px;flex-shrink:0;background:var(--sidebar);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo-badge{width:34px;height:34px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,#5A5CF2,#8C6BF8);display:flex;align-items:center;justify-content:center}
.logo-badge svg{width:20px;height:20px}
.logo-name{color:#fff;font-size:15px;font-weight:600;line-height:1.2}
.logo-sub{color:#8A8FA8;font-size:10.5px;margin-top:2px}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav-label{color:#6B7280;font-size:10.5px;letter-spacing:.06em;padding:8px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#A7ACBF;cursor:pointer;font-size:13.5px;user-select:none;transition:background .15s}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.05);color:#E5E7EB}
.nav-item.on{background:var(--primary);color:#fff}
.nav-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.nav-foot .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.nav-foot .u-name{color:#E5E7EB;font-size:13px}
.nav-foot .u-role{color:#8A8FA8;font-size:10.5px}
/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:17px;font-weight:600;flex:1}
.topbar .time{color:var(--text-3);font-size:12px;display:flex;align-items:center;gap:6px}
.topbar .time .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%;margin:0 auto}
/* ---------- KPI ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.kpi-ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-ic svg{width:22px;height:22px}
.kpi-label{color:var(--text-3);font-size:12.5px}
.kpi-value{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi-trend{font-size:11.5px;color:var(--text-4);margin-top:2px}
.kpi-trend b{font-weight:600}
.kpi-trend.up{color:var(--ok-text)} .kpi-trend.down{color:var(--bad-text)}
/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:16px 20px 12px}
.card-head h2{font-size:15px;font-weight:600;flex:1}
.card-head .hint{color:var(--text-4);font-size:12px}
.card-body{padding:0 20px 18px}
/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text-3);font-weight:500;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--border-2);background:#FAFBFC;white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid #F4F5F7;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.up-off{opacity:.55}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--text-2)}
/* ---------- 徽章 / 状态 ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%}
.badge.ok{background:var(--ok-soft);color:var(--ok-text)} .badge.ok .dot{background:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad-text)} .badge.bad .dot{background:var(--bad)}
.badge.off{background:var(--off-soft);color:#6B7280} .badge.off .dot{background:var(--off)}
.badge.warn{background:var(--warn-soft);color:#B45309} .badge.warn .dot{background:var(--warn)}
.badge.strategy{background:var(--primary-soft);color:var(--primary)}
.badge.tag{background:#F1F2F4;color:#57606A}
/* ---------- 表单 ---------- */
.frm{background:#F8F9FA;border:1px dashed #D4D7DD;border-radius:var(--radius-sm);padding:14px;margin-top:10px}
.frm label{font-size:12px;color:#57606A;display:block;margin:0 0 3px}
.frm .row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
input,select{font-size:12.5px;padding:7px 10px;border:1px solid var(--border-2);border-radius:var(--radius-sm);background:#fff;color:var(--text);margin:0}
input:focus,select:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
.btn{font-size:12.5px;padding:7px 14px;border:1px solid var(--border-2);border-radius:var(--radius-sm);background:#fff;cursor:pointer;color:var(--text-2);margin:0;transition:all .12s;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-p{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(79,70,229,.25)}
.btn-p:hover{background:#4338CA;color:#fff}
.btn-d{color:var(--bad-text)} .btn-d:hover{border-color:var(--bad);color:var(--bad)}
.btn-sm{padding:4px 10px;font-size:12px}
.msg{font-size:12px;color:var(--ok-text);margin-top:8px}
.err{font-size:12px;color:var(--bad-text);margin-top:8px}
/* ---------- 站点卡片 ---------- */
.site-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px 8px;flex-wrap:wrap}
.site-head .s-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.site-head .s-name svg{width:15px;height:15px;color:var(--text-3)}
.site-head .ops{display:flex;align-items:center;gap:8px}
/* ---------- 日志 ---------- */
.log-list{display:flex;flex-direction:column}
.log{font-size:12px;color:var(--text-2);padding:6px 0;border-bottom:1px solid #F4F5F7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.log:last-child{border-bottom:none}
.log .t{color:var(--text-4);margin-right:8px}
.log .arr{color:var(--primary);margin:0 6px}
/* ---------- 开关 ---------- */
.switch{position:relative;display:inline-block;width:32px;height:18px;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;cursor:pointer;inset:0;background:#D1D5DB;border-radius:9px;transition:.15s}
.switch .sl:before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+.sl{background:var(--primary)}
.switch input:checked+.sl:before{transform:translateX(14px)}
.lbl-switch{font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
/* ---------- CF 用量条 ---------- */
.usage-bar{height:6px;background:var(--border-2);border-radius:3px;overflow:hidden;min-width:90px}
.usage-bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.usage-bar i.warn{background:var(--warn)}
.usage-bar i.bad{background:var(--bad)}
.empty{color:var(--text-4);font-size:12.5px;padding:14px 0;text-align:center}
/* ---------- 面板切换 ---------- */
.panel{display:none}.panel.on{display:flex;flex-direction:column;gap:20px}
/* ---------- Modal ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(15,17,26,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:16px;width:480px;max-width:94vw;box-shadow:0 20px 50px rgba(0,0,0,.18);display:flex;flex-direction:column;max-height:86vh}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:600;flex:1}
.modal-x{border:none;background:none;font-size:20px;line-height:1;color:var(--text-3);cursor:pointer;padding:4px}
.modal-x:hover{color:var(--text)}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
.m-field{margin-bottom:14px}
.m-field label{display:block;font-size:12px;color:#57606A;margin-bottom:5px}
.m-field input,.m-field select{width:100%;font-size:13px;padding:8px 10px}
/* ---------- 响应式 ---------- */
@media(max-width:1000px){.kpi-row{grid-template-columns:repeat(2,1fr)}.sidebar{width:72px}.logo-name,.logo-sub,.nav-item span,.nav-label,.nav-foot .u-name,.nav-foot .u-role{display:none}.nav-item{justify-content:center}.logo{justify-content:center;padding:20px 0}}
@media(max-width:560px){.kpi-row{grid-template-columns:1fr}.content{padding:14px}.topbar{padding:0 14px}}
</style>
</head>
<body>
<div class="layout">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-badge">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="1.5" width="16" height="7" rx="1.8" fill="#fff" fill-opacity="0.95"/><rect x="2" y="10" width="16" height="7" rx="1.8" fill="#fff" fill-opacity="0.55"/><path d="M2 17.5H18V19H2Z" fill="#fff" fill-opacity="0.3"/></svg>
      </div>
      <div>
        <div class="logo-name">Edge Balancer</div>
        <div class="logo-sub">边缘负载均衡控制台</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-label">总览</div>
      <div class="nav-item on" id="nav-status" onclick="showTab('status')">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 3H8V8H3V3ZM10 3H15V8H10V3ZM3 10H8V15H3V10ZM10 10H15V15H10V10Z" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>总览</span>
      </div>
      <div class="nav-label">管理</div>
      <div class="nav-item" id="nav-config" onclick="showTab('config')">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 9H15.5" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>站点管理</span>
      </div>
      <div class="nav-item" id="nav-cf" onclick="showTab('cf')">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 2V16M9 2L5.5 5.5M9 2L12.5 5.5M9 16L5.5 12.5M9 16L12.5 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Cloudflare 配额</span>
      </div>
      <div class="nav-item" id="nav-log" onclick="showTab('log')">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 2H15V6H3V2ZM3 7H15V16H3V7ZM5 9V9.5M5 11.5V12M5 14V14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>请求日志</span>
      </div>
    </nav>
    <div class="nav-foot">
      <div class="avatar">A</div>
      <div>
        <div class="u-name">admin</div>
        <div class="u-role">超级管理员</div>
      </div>
    </div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <h1 id="page-title">总览</h1>
      <div class="time"><span class="dot"></span><span id="meta">加载中...</span></div>
    </header>

    <div class="content">
      <!-- 总览 -->
      <div class="panel on" id="panel-status">
        <div class="kpi-row">
          <div class="kpi">
            <div class="kpi-ic" style="background:var(--primary-soft)">
              <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 17V10M11 17V7M17 17V12" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round"/></svg>
            </div>
            <div>
              <div class="kpi-label">接入站点</div>
              <div class="kpi-value" id="kpi-sites">-</div>
              <div class="kpi-trend" id="kpi-sites-t">实时统计</div>
            </div>
          </div>
          <div class="kpi">
            <div class="kpi-ic" style="background:var(--ok-soft)">
              <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 3.5C6.58 3.5 3 7.08 3 11.5C3 16.42 7.5 20.5 11 20.5C14.5 20.5 19 16.42 19 11.5C19 7.08 15.42 3.5 11 3.5ZM11 13.5C12.66 13.5 14 12.16 14 10.5C14 8.84 12.66 7.5 11 7.5C9.34 7.5 8 8.84 8 10.5C8 12.16 9.34 13.5 11 13.5Z" fill="#10B981"/></svg>
            </div>
            <div>
              <div class="kpi-label">健康上游</div>
              <div class="kpi-value" id="kpi-health">-</div>
              <div class="kpi-trend" id="kpi-health-t">实时统计</div>
            </div>
          </div>
          <div class="kpi">
            <div class="kpi-ic" style="background:var(--warn-soft)">
              <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 16.5V12M9 16.5V9M14 16.5V5.5M19 16.5V10.5" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/></svg>
            </div>
            <div>
              <div class="kpi-label">累计转发</div>
              <div class="kpi-value" id="kpi-total">-</div>
              <div class="kpi-trend" id="kpi-total-t">实时统计</div>
            </div>
          </div>
          <div class="kpi">
            <div class="kpi-ic" style="background:var(--primary-soft)">
              <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 4C6.86 4 3.5 7.36 3.5 11.5C3.5 15.64 6.86 19 11 19C15.14 19 18.5 15.64 18.5 11.5C18.5 7.36 15.14 4 11 4ZM11 7V11.5L15 14" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div>
              <div class="kpi-label">在途连接</div>
              <div class="kpi-value" id="kpi-flight">-</div>
              <div class="kpi-trend" id="kpi-flight-t">实时统计</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>站点健康状态</h2>
            <span class="hint">按域名分组的实时健康与流量</span>
          </div>
          <div class="card-body" id="sites"></div>
        </div>
      </div>

      <!-- 请求日志 -->
      <div class="panel" id="panel-log">
        <div class="card">
          <div class="card-head">
            <h2>最近请求（按域名分发记录）</h2>
            <span class="hint">最多保留 200 条</span>
          </div>
          <div class="card-body"><div class="log-list" id="log"></div></div>
        </div>
      </div>

      <!-- 站点管理 -->
      <div class="panel" id="panel-config">
        <div class="card">
          <div class="card-head"><h2>全局设置</h2><span class="hint">保存后 5 秒热加载生效</span></div>
          <div class="card-body">
            <div class="frm"><div class="row">
              <div><label>admin_token（面板访问 token，留空不鉴权）</label><input id="set-admin-token" size="24" placeholder="留空不鉴权"></div>
              <div><label>健康检查间隔（秒）</label><input id="set-hi" size="6" type="number" value="10"></div>
              <div><label>健康检查超时（秒）</label><input id="set-ht" size="6" type="number" value="5"></div>
              <div><label>健康检查路径</label><input id="set-hp" size="12" value="/api/health"></div>
              <div><label>默认均衡策略</label><select id="set-strategy"><option value="least-conn">least-conn</option><option value="weighted">weighted</option></select></div>
              <div><label>上游转发超时（秒，超时自动熔断切换）</label><input id="set-ut" size="6" type="number" value="10"></div>
              <button class="btn btn-p" onclick="saveSettings()">保存全局设置</button>
            </div></div>
            <div id="msg-settings"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>站点</h2>
            <span class="hint">按 Host 头路由域名到上游组</span>
            <button class="btn btn-p btn-sm" onclick="openSiteModal()">新增站点</button>
          </div>
          <div class="card-body">
            <div id="sites-cfg"></div>
            <div id="msg-sites"></div>
          </div>
        </div>
      </div>

      <!-- Cloudflare 配额 -->
      <div class="panel" id="panel-cf">
        <div class="card">
          <div class="card-head">
            <h2>Cloudflare 配额（多账号）</h2>
            <span class="hint">免费版 10 万请求/天，超阈值自动切换兜底上游</span>
            <button class="btn btn-sm" onclick="openCFModal()">新增账号</button>
            <button class="btn btn-sm" onclick="checkCF()">立即检查配额并切换</button>
          </div>
          <div class="card-body">
            <div id="cf-list"></div>
            <div id="msg-cf"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 通用 Modal -->
<div class="modal-mask" id="modal-mask" style="display:none">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">标题</h3>
      <button class="modal-x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-p" onclick="submitModal()">保存</button>
    </div>
  </div>
</div>

<script>
var PAGE = 'status';
function qs(k){return new URLSearchParams(location.search).get(k)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function api(path,opts){var u=path;var t=qs('token');if(t)u+=(u.indexOf('?')<0?'?':'&')+'token='+encodeURIComponent(t);return fetch(u,opts).then(function(r){return r.json().catch(function(){return {}})})}

function showTab(n){
  PAGE=n;
  var titles={status:'总览',config:'站点管理',cf:'Cloudflare 配额',log:'请求日志'};
  document.getElementById('page-title').textContent=titles[n]||'总览';
  ['status','config','cf','log'].forEach(function(k){
    document.getElementById('nav-'+k).className='nav-item'+(k===n?' on':'');
    var p=document.getElementById('panel-'+k);
    if(p){p.className='panel'+(k===n?' on':'')}
  });
  if(n==='config'){loadConfig();loadCF()}
  if(n==='cf'){loadCF()}
  if(n==='log'){loadStatus()}
}

/* ---------- 通用 Modal ---------- */
var modalCtx=null;
function openModal(title,fields,values,onSubmit){
  modalCtx=onSubmit;
  document.getElementById('modal-title').textContent=title;
  var html='';
  fields.forEach(function(f){
    var v=values&&values[f.key]!=null?values[f.key]:'';
    html+='<div class="m-field"><label>'+esc(f.label)+'</label>';
    if(f.type==='select'){
      html+='<select id="mf-'+f.key+'">';
      (f.options||[]).forEach(function(o){
        var ov=o,ol=o;
        if(typeof o==='object'){ov=o.v;ol=o.l}
        html+='<option value="'+esc(ov)+'"'+(String(v)===String(ov)?' selected':'')+'>'+esc(ol)+'</option>';
      });
      html+='</select>';
    }else if(f.type==='number'){
      html+='<input id="mf-'+f.key+'" type="number" value="'+esc(v)+'" placeholder="'+esc(f.placeholder||'')+'">';
    }else if(f.type==='check'){
      html+='<label class="lbl-switch"><span class="switch"><input type="checkbox" id="mf-'+f.key+'"'+(v?' checked':'')+'><span class="sl"></span></span><span>启用</span></label>';
    }else{
      html+='<input id="mf-'+f.key+'" value="'+esc(v)+'" placeholder="'+esc(f.placeholder||'')+'">';
    }
    html+='</div>';
  });
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-mask').style.display='flex';
}
function closeModal(){
  document.getElementById('modal-mask').style.display='none';
  modalCtx=null;
}
function submitModal(){if(modalCtx)modalCtx()}
function mval(key){
  var el=document.getElementById('mf-'+key);
  if(!el)return '';
  return el.type==='checkbox'?el.checked:el.value;
}

/* ---------- 总览 ---------- */
function loadStatus(){
  api('/admin/api').then(function(d){
    var totalUp=0,healthy=0,enabled=0,inFlight=0;
    d.sites.forEach(function(s){
      s.upstreams.forEach(function(x){
        totalUp+=x.total;
        if(x.enabled){enabled++}
        if(x.enabled&&x.healthy){healthy++}
        inFlight+=x.inFlight;
      });
    });
    document.getElementById('kpi-sites').textContent=d.sites.length;
    document.getElementById('kpi-health').textContent=healthy+' / '+enabled;
    document.getElementById('kpi-total').textContent=fmt(totalUp);
    document.getElementById('kpi-flight').textContent=inFlight;
    document.getElementById('meta').textContent='更新于 '+d.time+' · '+d.sites.length+' 个站点';
    var html='';
    d.sites.forEach(function(s){
      html+='<div class="site-head"><div class="s-name">'+
        '<svg viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7.5" cy="7.5" r="6" stroke="currentColor" stroke-width="1.3"/></svg>'+
        esc(s.domain)+' <span class="badge strategy">'+esc(s.strategy)+'</span></div>'+
        '<div class="ops"><span class="hint" style="font-size:12px;color:var(--text-4)">'+
        s.upstreams.filter(function(x){return x.enabled&&x.healthy}).length+' / '+s.upstreams.length+' 上游健康</span></div></div>';
      html+='<table><thead><tr><th>上游</th><th>地址</th><th>状态</th><th>权重</th><th>优先级</th><th>在途</th><th>累计转发</th></tr></thead><tbody>';
      s.upstreams.forEach(function(x){
        var st,cls;
        if(!x.enabled){st='已停用';cls='off'}
        else if(x.tripped){st='熔断中';cls='warn'}
        else if(x.healthy){st='健康';cls='ok'}
        else{st='不健康';cls='bad'}
        html+='<tr'+(x.enabled?'':' class="up-off"')+'><td>'+esc(x.name)+'</td><td class="code">'+esc(x.url)+'</td>'+
          '<td><span class="badge '+cls+'"><span class="dot"></span>'+st+'</span></td>'+
          '<td>'+x.weight+'</td><td>'+x.priority+'</td><td>'+x.inFlight+'</td><td class="code">'+fmt(x.total)+'</td></tr>';
      });
      html+='</tbody></table>';
    });
    document.getElementById('sites').innerHTML=html||'<div class="empty">暂无站点，去「站点管理」添加</div>';
    var logHtml='';
    d.log.forEach(function(e){
      logHtml+='<div class="log"><span class="t">'+esc(e.time)+'</span>'+esc(e.host)+' '+esc(e.path)+
        '<span class="arr">→</span>'+esc(e.site)+' / '+esc(e.upstream)+'</div>';
    });
    document.getElementById('log').innerHTML=logHtml||'<div class="empty">暂无请求记录</div>';
  }).catch(function(e){document.getElementById('meta').textContent='加载失败: '+e});
}
function fmt(n){return n>=10000?(n/10000).toFixed(1)+' 万':n}

/* ---------- 站点管理 ---------- */
var gSites=[];
function loadConfig(){
  api('/admin/api/sites').then(function(sites){
    gSites=sites;
    var html='';
    sites.forEach(function(s){
      html+='<div class="card" style="box-shadow:none;border:1px solid var(--border);margin-bottom:14px"><div class="site-head">'+
        '<div class="s-name">'+esc(s.domain)+' <span class="badge strategy">'+esc(s.strategy||'默认')+'</span></div>'+
        '<div class="ops">'+
        '<label class="lbl-switch"><span style="color:#57606A">启用</span><span class="switch"><input type="checkbox" '+(s.enabled?'checked':'')+' onchange="toggleSite('+s.id+',this.checked)"><span class="sl"></span></span></label>'+
        '<button class="btn btn-sm" onclick="openSiteModal('+s.id+')">编辑</button>'+
        '<button class="btn btn-d btn-sm" onclick="delSite('+s.id+')">删除</button>'+
        '</div></div>'+
        '<div class="card-body" style="padding-top:4px">'+
        '<table><thead><tr><th>上游</th><th>地址</th><th>host</th><th>权重</th><th>优先级</th><th>健康路径</th><th>CF 账号</th><th>启用</th><th></th></tr></thead><tbody>';
      s.upstreams.forEach(function(u){
        html+='<tr'+(u.enabled?'':' class="up-off"')+'><td>'+esc(u.name)+'</td><td class="code">'+esc(u.url)+'</td><td class="code">'+esc(u.host||'-')+'</td>'+
          '<td>'+u.weight+'</td><td>'+u.priority+'</td><td class="code">'+esc(u.health||'-')+'</td><td class="code">'+esc(u.cf_account||'-')+'</td>'+
          '<td><label class="lbl-switch"><span class="switch"><input type="checkbox" '+(u.enabled?'checked':'')+' onchange="toggleUp('+u.id+',this.checked)"><span class="sl"></span></span></label></td>'+
          '<td><button class="btn btn-sm" onclick="openUpModal('+s.id+','+u.id+')">编辑</button> <button class="btn btn-d btn-sm" onclick="delUp('+u.id+')">删除</button></td></tr>';
      });
      html+='</tbody></table>'+
        '<div class="row" style="margin-top:10px"><button class="btn btn-sm" onclick="openUpModal('+s.id+')">新增上游</button></div>'+
        '</div></div>';
    });
    document.getElementById('sites-cfg').innerHTML=html||'<div class="empty">暂无站点，点右上角「新增站点」</div>';
    if(sites.length)loadSettings();
  }).catch(function(e){document.getElementById('msg-sites').className='err';document.getElementById('msg-sites').textContent='加载配置失败: '+e});
}

function openSiteModal(id){
  var site=id==null?null:gSites.find(function(x){return x.id===id});
  openModal(site?'编辑站点':'新增站点',[
    {key:'domain',label:'域名（匹配 Host 头）',placeholder:'example.shenzjd.com'},
    {key:'strategy',label:'均衡策略',type:'select',options:[{v:'',l:'默认'},{v:'least-conn',l:'least-conn'},{v:'weighted',l:'weighted'}]},
    {key:'health_path',label:'健康检查路径（可选）',placeholder:'/api/health'},
    {key:'enabled',label:'启用',type:'check'}
  ],site,function(){
    var domain=mval('domain');
    if(!domain){alert('域名不能为空');return}
    var body={domain:domain,strategy:mval('strategy'),health_path:mval('health_path'),enabled:mval('enabled')?true:false};
    var path='/admin/api/sites',method='POST';
    if(site){path+='/'+site.id;method='PUT'}
    api(path,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(){
      closeModal();loadConfig();
    }).catch(function(e){alert('保存失败: '+e)});
  });
}

function openUpModal(sid,uid){
  var up=uid==null?null:gSites.find(function(x){return x.id===sid}).upstreams.find(function(x){return x.id===uid});
  // CF 账号改为下拉：选项来自已配置的账号列表（gCF）；编辑时若当前值不在列表则补一项避免丢失
  var cfOpts=[{v:'',l:'无（不关联配额账号）'}];
  gCF.forEach(function(a){cfOpts.push({v:a.name,l:a.name})});
  if(up&&up.cf_account&&!gCF.some(function(a){return a.name===up.cf_account})){
    cfOpts.push({v:up.cf_account,l:up.cf_account+'（未配置）'});
  }
  openModal(up?'编辑上游':'新增上游',[
    {key:'name',label:'名称',placeholder:'cf-worker'},
    {key:'url',label:'URL',placeholder:'https://xxx.workers.dev/'},
    {key:'host',label:'Host（CF Worker 填 workers.dev 域名）',placeholder:'本地源站留空'},
    {key:'weight',label:'权重',type:'number'},
    {key:'priority',label:'优先级',type:'number'},
    {key:'health',label:'健康路径（可选）',placeholder:'/api/health'},
    {key:'cf_account',label:'CF 账号（配额监控）',type:'select',options:cfOpts},
    {key:'enabled',label:'启用',type:'check'}
  ],up,function(){
    var body={name:mval('name'),url:mval('url'),host:mval('host'),weight:+mval('weight')||1,priority:+mval('priority')||0,health:mval('health'),cf_account:mval('cf_account'),enabled:mval('enabled')?true:false};
    if(!body.name||!body.url){alert('名称和 URL 不能为空');return}
    var path='/admin/api/sites/'+sid+'/upstreams',method='POST';
    if(up){path='/admin/api/upstreams/'+up.id;method='PUT'}
    api(path,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(){
      closeModal();loadConfig();
    }).catch(function(e){alert('保存失败: '+e)});
  });
}

function loadSettings(){
  api('/admin/api/settings').then(function(m){
    if(m['admin_token']!=null)document.getElementById('set-admin-token').value=m['admin_token'];
    if(m['health_interval'])document.getElementById('set-hi').value=m['health_interval'];
    if(m['health_timeout'])document.getElementById('set-ht').value=m['health_timeout'];
    if(m['health_path'])document.getElementById('set-hp').value=m['health_path'];
    if(m['strategy'])document.getElementById('set-strategy').value=m['strategy'];
    if(m['upstream_timeout'])document.getElementById('set-ut').value=m['upstream_timeout'];
  });
}
function saveSettings(){
  var body={};
  body['admin_token']=document.getElementById('set-admin-token').value;
  body['health_interval']=document.getElementById('set-hi').value;
  body['health_timeout']=document.getElementById('set-ht').value;
  body['health_path']=document.getElementById('set-hp').value;
  body['strategy']=document.getElementById('set-strategy').value;
  body['upstream_timeout']=document.getElementById('set-ut').value;
  api('/admin/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(){
    document.getElementById('msg-settings').className='msg';document.getElementById('msg-settings').textContent='全局设置已保存并生效';
  }).catch(function(e){document.getElementById('msg-settings').className='err';document.getElementById('msg-settings').textContent='保存失败: '+e});
}
function toggleSite(id,on){api('/admin/api/sites/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:on})}).then(loadConfig)}
function toggleUp(id,on){api('/admin/api/upstreams/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:on})}).then(loadConfig)}
function delSite(id){var s=gSites.find(function(x){return x.id===id});if(!s)return;if(!confirm('删除站点 '+s.domain+' 及其全部上游？'))return;api('/admin/api/sites/'+id,{method:'DELETE'}).then(loadConfig)}
function delUp(id){if(!confirm('删除该上游？'))return;api('/admin/api/upstreams/'+id,{method:'DELETE'}).then(loadConfig)}

/* ---------- Cloudflare 配额 ---------- */
var gCF=[];
function loadCF(){
  api('/admin/api/cf').then(function(d){
    gCF=d.accounts||[];
    renderCF();
    renderCFUsage(d.usages);
  });
}
function renderCF(){
  var html='<table><thead><tr><th>账号</th><th>Account ID</th><th>额度</th><th>阈值%</th><th></th></tr></thead><tbody>';
  gCF.forEach(function(a,i){
    html+='<tr><td>'+esc(a.name)+'</td><td class="code">'+esc(a.account_id)+'</td><td>'+fmt(a.quota)+'</td><td>'+a.threshold+'</td>'+
      '<td><button class="btn btn-sm" onclick="openCFModal('+i+')">编辑</button> <button class="btn btn-d btn-sm" onclick="delCFRow('+i+')">删除</button></td></tr>';
  });
  html+='</tbody></table>';
  document.getElementById('cf-list').innerHTML=html||'<div class="empty">未配置账号，点「新增账号」</div>';
}
function openCFModal(i){
  var acc=i==null?null:gCF[i];
  openModal(acc?'编辑账号':'新增账号',[
    {key:'name',label:'账号名',placeholder:'账号A'},
    {key:'token',label:'API Token（只读）',placeholder:'CF API Token'},
    {key:'account_id',label:'Account ID',placeholder:'CF Account ID'},
    {key:'quota',label:'免费额度（请求数）',type:'number'},
    {key:'threshold',label:'阈值 %',type:'number'}
  ],acc,function(){
    var a={name:mval('name'),token:mval('token'),account_id:mval('account_id'),quota:+mval('quota')||100000,threshold:+mval('threshold')||90};
    if(!a.name){alert('账号名不能为空');return}
    if(i==null)gCF.push(a);else gCF[i]=a;
    saveCF();
  });
}
function delCFRow(i){
  if(!confirm('删除 CF 账号「'+gCF[i].name+'」？'))return;
  gCF.splice(i,1);
  saveCF();
}
function saveCF(){
  api('/admin/api/cf',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(gCF)}).then(function(){
    document.getElementById('msg-cf').className='msg';document.getElementById('msg-cf').textContent='账号已保存';
    closeModal();
    loadCF();
  }).catch(function(e){document.getElementById('msg-cf').className='err';document.getElementById('msg-cf').textContent='保存失败: '+e});
}
function checkCF(){
  api('/admin/api/cf/check',{method:'POST'}).then(function(d){
    var txt='';
    if(d.actions&&d.actions.length){txt='执行: '+d.actions.join('；')}
    else{txt='配额正常，无切换动作'}
    document.getElementById('msg-cf').className='msg';document.getElementById('msg-cf').textContent=txt;
    renderCFUsage(d.usages);
    loadConfig();
  }).catch(function(e){document.getElementById('msg-cf').className='err';document.getElementById('msg-cf').textContent='检查失败: '+e});
}
function renderCFUsage(usages){
  if(!usages||!usages.length)return;
  var html='<div class="card-head" style="padding:14px 0 6px"><h2 style="font-size:14px">用量</h2></div>'+
    '<table><thead><tr><th>账号</th><th>已用请求</th><th>额度</th><th>使用率</th><th>状态</th></tr></thead><tbody>';
  usages.forEach(function(u){
    var st,cls,pct;
    if(u.error){st='查询失败';cls='bad';pct=0}
    else if(u.over_limit){st='超阈值';cls='bad';pct=Math.min(u.percent,100)}
    else if(u.auto_off){st='自动停用中';cls='warn';pct=Math.min(u.percent,100)}
    else{st='正常';cls='ok';pct=Math.min(u.percent,100)}
    var barCls=(u.over_limit?'bad':(pct>=(u.threshold||90)?'warn':''));
    html+='<tr><td>'+esc(u.name)+'</td><td class="code">'+(u.error?'-':fmt(u.used))+'</td><td class="code">'+(u.quota?fmt(u.quota):'-')+'</td>'+
      '<td style="display:flex;align-items:center;gap:8px"><div class="usage-bar"><i class="'+barCls+'" style="width:'+pct+'%"></i></div><span style="font-size:12px;color:var(--text-2)">'+(u.error?'-':u.percent.toFixed(1)+'%')+'</span></td>'+
      '<td><span class="badge '+cls+'"><span class="dot"></span>'+st+'</span></td></tr>';
  });
  html+='</tbody></table>';
  var el=document.getElementById('cf-list');
  el.innerHTML=el.innerHTML+'<div style="margin-top:8px">'+html+'</div>';
}

loadStatus();setInterval(loadStatus,3000);
</script>
</body>
